name: Deploy and Rollback Automation

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pytest

      - name: Run Tests
        run: pytest test_calculator.py -v

      - name: Deploy Application
        if: success()
        run: echo "Application deployed successfully"

      - name: Rollback Notification
        if: failure()
        run: echo "Deployment failed. Rollback required."
